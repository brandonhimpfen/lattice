[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice"
version = "0.1.0a1"
description = "A lightweight, provider-neutral Python framework for LLM applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "ai", "language-models", "tools", "structured-output"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.urls]
Documentation = "https://github.com/brandonhimpfen/lattice#readme"
Repository = "https://github.com/brandonhimpfen/lattice"
Issues = "https://github.com/brandonhimpfen/lattice/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lattice = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lattice"]
mypy_path = "src"
warn_unused_configs = true

[tool.coverage.run]
source = ["lattice"]
branch = true
